<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>そらとぶ自転車 英単語世界一周</title>
</head>
<body>
  <div id="app">
    <!-- 空の場面（ウィンドウに合わせて描く）と、その上の情報 -->
    <main id="stage">
      <canvas id="scene"></canvas>
      <div id="hud">
        <div id="info">
          <span class="chip" id="dest">→ ---</span>
          <span class="chip" id="remain">あと 0km</span>
          <span class="chip" id="count"></span>
          <span class="chip boost" id="boost"></span>
        </div>
        <div id="altMeter" title="高度"><div id="altFill"></div></div>
        <div id="meaning"></div>
      </div>
    </main>

    <!-- 字幕のように例文を出す。書き取りと操作はここ -->
    <section id="caption">
      <div id="sentenceBox"></div>
      <div id="feedback"></div>
      <div class="controls">
        <button class="b-quit" id="btnQuit">やめる</button>
        <button id="btnPass">パス</button>
        <button class="b-listen" id="btnListen">🔊 聴く <kbd>Space</kbd></button>
      </div>
      <div id="kbd"></div>
    </section>

    <!-- メニュー・到着・復習（ステージの上に重ねる 1 枚のページ） -->
    <div id="page">
      <div id="pageInner">
        <section id="mapPanel">
          <div id="mapHead"><span class="chip" id="mapName">---</span><span>総距離 <b id="mapTotal">0</b>km</span></div>
          <canvas id="mapCanvas"></canvas>
        </section>
        <section id="panel"></section>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
