name: Deploy to GitHub Pages

# main に push されたら（＝PR がマージされたら）自動で公開する。
# 初回だけ、リポジトリの Settings → Pages → Source を「GitHub Actions」にする。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # 音声: 前回までに生成したものを復元し、足りない分だけ生成する（npm run tts）。
      # リポジトリ変数 AWS_TTS_ROLE_ARN（Polly を呼べる IAM ロール、OIDC で信頼）が無ければ
      # 生成は飛ばし、音声の無い問題はブラウザの声で読む。
      - uses: actions/cache@v4
        with:
          path: audio
          key: tts-${{ hashFiles('content/**') }}
          restore-keys: tts-
      - if: vars.AWS_TTS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TTS_ROLE_ARN }}
          aws-region: us-east-1
      - if: vars.AWS_TTS_ROLE_ARN != ''
        run: npm run tts -- --prune
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
