# ゲーム全体の設定。値を変えて `npm run dev` で確認できます。
# 項目の意味と型は src/content/schema.ts を参照（ビルド時に検証されます）。

# 出題に使う問題集（content/questions/<id>.yaml の id）。
# enabled: false にすると、初期状態ではチェックが外れた状態で表示されます。
questionSets:
  - id: eiken2
    enabled: true
  - id: pre1
    enabled: true

# 1区間（都市→都市）あたりの問題数
questionsPerLeg: 15

# shuffle: ランダム / sequential: ファイルの順番どおり
order: shuffle

display:
  # 出題中、まだ書いていない部分を "_" で見せる（単語の長さと記号がわかる）
  showLetterCount: true
  # 正解後に例文全体と和訳を表示する（和訳は正解したときだけ出る）
  showReview: true
  reviewMs: 3200

speech:
  rate: 0.9
  airshipRate: 0.9
  # 音声ファイルが無いときに、ブラウザ内蔵の声で読む言語（先頭から順に探す）
  voice: [en-US, en-GB]
  # 事前生成する音声（npm run tts で生成。生成していない問題はブラウザの声で読む）
  # 声を変えると、その声の音声はすべて作り直しになる
  tts:
    provider: polly
    region: us-east-1
    # 通常の出題で読む人物（名前: 声）。全問ぶん作り、毎問この中からランダムに1人が読む
    # engine: generative は生成 AI の声（us-east-1 などの一部リージョンのみ）
    speakers:
      tiffany: { voiceId: Tiffany, engine: generative }
      nate: { voiceId: Nate, engine: generative }
    # 飛行船のなまり。キーは都市ごとの言語（src/data/route.ts の accent）
    # ここに無い言語（ja-JP・fr-FR など）はブラウザの声で読む
    # 通常の人物と同じ声を書くと、その音声を使い回す（追加のファイルは作らない）
    accents:
      en-US: { voiceId: Tiffany, engine: generative }
      en-GB: { voiceId: Amy, engine: generative }
      en-AU: { voiceId: Olivia, engine: generative }
      en-NZ: { voiceId: Aria, engine: generative }
      en-ZA: { voiceId: Ayanda, engine: generative }
      en-IN: { voiceId: Kajal, engine: generative }
    # なまりごとに音声を作る問題数（飛行船ではこの中から出題する）
    accentQuestions: 20

altitude:
  # 高度は 0〜100。時間とともに下がり、0 で墜落（その区間は失敗してメニューに戻る）。
  # 読み上げが終わってから下がり始める。打ち間違えても下がらない。
  start: 55
  decayPerSec: 4.0
  decayIncreasePerLap: 0.5
  # 正しい文字を 1 文字書くたびに上がる量（例文は平均 40 文字ほど）
  gainPerLetter: 2.5

airship:
  probability: 0.12
  boostSeconds: 25
  multiplier: 2
