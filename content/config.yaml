# ゲーム全体の設定。値を変えて `npm run dev` で確認できます。
# 項目の意味と型は src/content/schema.ts を参照（ビルド時に検証されます）。

# 出題に使う問題集（content/questions/<id>.yaml の id）。
# enabled: false にすると、初期状態ではチェックが外れた状態で表示されます。
questionSets:
  - id: eiken2
    enabled: false
  - id: pre1
    enabled: false
  - id: b1
    enabled: true

# 1区間（都市→都市）あたりの問題数
questionsPerLeg: 10

# shuffle: ランダム / sequential: ファイルの順番どおり
order: shuffle

display:
  # 出題中、まだ書いていない部分を "_" で見せる（単語の長さと記号がわかる）
  showLetterCount: true
  # 正解後に例文全体と和訳を表示する（和訳は正解したときだけ出る）
  showReview: true
  reviewMs: 3200

speech:
  rate: 0.9
  airshipRate: 0.9
  # 音声ファイルが無いときに、ブラウザ内蔵の声で読む言語（先頭から順に探す）
  voice: [en-US, en-GB]
  # 事前生成する音声（npm run tts で生成。生成していない問題はブラウザの声で読む）
  # 声を変えると、その声の音声はすべて作り直しになる
  tts:
    provider: polly
    region: us-east-1
    # 通常の出題で読む人物（名前: 声）。全問ぶん作り、毎問この中からランダムに1人が読む
    # engine: generative は生成 AI の声（us-east-1 などの一部リージョンのみ）
    speakers:
      tiffany: { voiceId: Tiffany, engine: generative }
      nate: { voiceId: Nate, engine: generative }
    # 飛行船のなまり。キーは都市ごとの言語（src/data/route.ts の accent）
    # ここに無い言語（ja-JP・fr-FR など）はブラウザの声で読む
    # 通常の人物と同じ声を書くと、その音声を使い回す（追加のファイルは作らない）
    accents:
      en-US: { voiceId: Tiffany, engine: generative }
      en-GB: { voiceId: Amy, engine: generative }
      en-AU: { voiceId: Olivia, engine: generative }
      en-NZ: { voiceId: Aria, engine: generative }
      en-ZA: { voiceId: Ayanda, engine: generative }
      en-IN: { voiceId: Kajal, engine: generative }
    # なまりごとに音声を作る問題数（飛行船ではこの中から出題する）
    accentQuestions: 20
    # 音声の置き場所（S3）と配信元（CloudFront）。infra/ で `npx cdk deploy` したときの出力を書く（README「音声の生成」）
    # 書かなければリポジトリ直下の audio/ に生成してビルドに含める
    storage:
      bucket: skybikeenglishaudio-audio9ab18887-0bukq4vj0c7e
      baseUrl: https://d26s0gkykn7rvi.cloudfront.net

altitude:
  # 高度は 0〜100。時間とともに下がり、0 で墜落（その区間は失敗してメニューに戻る）。
  # 読み上げが終わってから下がり始める。打ち間違えても下がらない。
  start: 55
  decayPerSec: 4.0
  decayIncreasePerLap: 0.5
  # 正しい文字を 1 文字書くたびに上がる量（例文は平均 40 文字ほど）
  gainPerLetter: 2.5

airship:
  probability: 0.12
  boostSeconds: 25
  multiplier: 2

# 例文のレベルの基準（CEFR）。問題集の level で選び、npm run content:levels で判定する（基準外は警告）。
# 単語のレベルは content/wordlists/ の CEFR の単語表（CEFR-J・Octanove C1/C2）で決める。
# 考え方: 答えはそのレベルで覚える語、ほかの語はそのレベルまでに覚えている語（＝そのレベルの人が無理なく聞き取れる文）。
#   answer:      答えの単語のレベル
#   othersMax:   答え以外の単語の上限。単語表に無い語は上限超えとみなす
#   othersAbove: othersMax を超えてよい語の数
#   words:       例文の語数の範囲（書き取りの負担。暫定値で、実際の例文を見て調整する）
levels:
  b1:
    title: CEFR B1
    answer: [B1]
    othersMax: B1
    othersAbove: 1
    words: [6, 12]
  b2:
    title: CEFR B2
    answer: [B2]
    othersMax: B2
    othersAbove: 1
    words: [8, 16]
  c1:
    title: CEFR C1
    answer: [C1]
    othersMax: C1
    othersAbove: 1
    words: [10, 20]
